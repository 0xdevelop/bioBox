storage_cfg: # 存储。enabled 为 true 的引擎会打开，可以同时开多个
  primary: "sqlite" # 主关系库；多个关系库时必须显式指定
  storage_sqlite:
    enabled: true
    path: "./data/protenix_service.db"
  # Auth/User/Task 均走主库，本实例只启用 SQLite，不需要 MySQL/Redis。
  storage_mysql:
    enabled: false
    dbname: "protenix_service"
    dbuser: "protenix_service"
    dbpwd: "protenix_service_pwd"
    dbaddress: "127.0.0.1"
    dbport: 3306
  storage_postgresql:
    enabled: false
    dbname: "protenix_service"
    dbuser: "protenix_service"
    dbpwd: "protenix_service_pwd"
    dbaddress: "127.0.0.1"
    dbport: 5432
    sslmode: "disable"
  storage_redis:
    enabled: false
    addr: "127.0.0.1:6379"
    password: ""
    db_index: 0
    database: false
api_cfg: # API configurations
  api_cfg_jsonRPC: # API configurations with JSON-RPC
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13001
    encryption_enabled: false
  api_cfg_mcp: # API configurations with MCP
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13002
    mcp_transport_type: "streamable-http"
  api_cfg_websocket: # API configurations with WebSocket
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13004
    allowed_origins:
    - "127.0.0.1:*"
    - "localhost:*"
  api_cfg_grpc: # API configurations with gRPC
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13005
test_ui_cfg: # 开发测试台
  enabled: true
  bind_address: "127.0.0.1" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
  port: 13003
frontend_cfg: # 前端页面服务配置
  enabled: true
  bind_address: "127.0.0.1"
  port: 13006
policy_cfg: # Policy scheduling configurations
  max_workers: 1 # 单 GPU 的绝对并发上限；正数生效
  policy_duration: "10s" # 定期轮询事项执行完一次到下一次的间隔，Go duration 字符串
  workers_scaller: 5 # 最大异步并发 = CPU 数量 × 倍率
  task_lifecycle_timeout_enabled: false # 是否启用任务整体生命周期超时；必须是 true/false。false 时忽略下面的 seconds，不设默认三天
  task_lifecycle_timeout_seconds: 3600 # 整体超时（秒），从 Accept/created_at 起算；仅在上一开关为 true 时生效，且必须为正整数（0 或负数会被配置校验拒绝）。此处只是示例值，不是默认期限
  task_execute_retry_limit_enabled: false # 是否启用执行重试次数限制；必须是 true/false，不用 0/1 代替
  task_execute_retry_limit_count: 0 # 首次执行之外允许的重试次数；0 表示不重试，不是无限。仅在上一开关为 true 时生效
auth_cfg: # Auth configurations
  enabled: true # 统一准入门禁开关；缺省 true；false=门禁放行不提供身份，依赖身份的方法不可用
  auth_type: "jwt" # 鉴权类型；缺省与当前唯一支持值均为 jwt
  email:
    enabled: false # 仅控制邮件；真实验证码始终写服务 INFO 日志
    provider: "resend" # 供应商值，不是能力配置键
    api_key: ""
    from: ""
    reply_to: ""
    product_name: "protenix_service"
    verification_subject: "protenix_service verification code"
  verification: # Verification code policy
    code_ttl_seconds: 600
    max_attempts: 5
    send_interval_seconds: 60
    hourly_send_limit: 5
    code_hash_secret: "dev_local_code_hash_secret_0123456789"
  session: # JWT and refresh session policy
    jwt_signing_secret: "dev_local_jwt_signing_secret_0123456789"
    issuer: "protenix_service"
    audience: "protenix_service"
    access_token_ttl_seconds: 900
    refresh_token_ttl_seconds: 2592000

cli_cfg: # 原生 CLI 接线（protenix-run / pxdesign-run）。路径指向 install_protenix_service.sh 安装的 /protenix_service/runtime 布局；binary 为空时 Execute 拒绝启动进程，不猜路径。
  work_root: "/protenix_service/data/cli_jobs" # 每任务作业目录根路径；输入会拷贝到子目录，不改原文件
  cancel_grace_seconds: 10 # 向进程组发 SIGTERM 后、再发 SIGKILL 的等待秒数
  execute_timeout_enabled: false # 是否启用单次 Execute 超时；必须是 true/false。false 时忽略下面的 seconds，不限制单次 Execute 时长
  execute_timeout_seconds: 3600 # 单次 Execute 最长秒数（从本次开始执行起算）；仅在上一开关为 true 时生效且必须为正整数（0 或负数会被配置校验拒绝）。到期后取消进程组，任务记 system_error。此处只是示例值
  protenix:
    binary: "/protenix_service/runtime/protenix/bin/protenix-run" # v1 runtime 缺省使用的已安装 protenix-run 路径；为空且未在 version_runtimes.v1 给出非空路径时，version=v1（或缺省）拒绝启动
    extra_env: {}
    version_runtimes: # 按 arguments.version 选择独立 runtime；version 不进 CLI 参数或 URL
      v2:
        binary: "" # v2 必须单独配置的已安装路径。空字符串表示未配置；version=v2 不会回退到上级 binary。跑通 v2 还需要授权权重
        extra_env: {} # 显式空映射表示不附加额外变量；若省略该键则沿用上级 extra_env
  pxdesign:
    binary: "/protenix_service/runtime/pxdesign/bin/pxdesign-run" # 已安装的 pxdesign-run 路径
    extra_env: {}

