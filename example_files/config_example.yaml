storage_cfg: # 存储。enabled 为 true 的引擎会打开，可以同时开多个
  primary: "sqlite" # 主关系库；多个关系库时必须显式指定
  storage_sqlite:
    enabled: true
    path: "./data/bioBox.db"
  # Auth/User/Task 均走主库，本实例只启用 SQLite，不需要 MySQL/Redis。
  storage_mysql:
    enabled: false
    dbname: "bioBox"
    dbuser: "bioBox"
    dbpwd: "bioBox_pwd"
    dbaddress: "127.0.0.1"
    dbport: 3306
  storage_postgresql:
    enabled: false
    dbname: "bioBox"
    dbuser: "bioBox"
    dbpwd: "bioBox_pwd"
    dbaddress: "127.0.0.1"
    dbport: 5432
    sslmode: "disable"
  storage_redis:
    enabled: false
    addr: "127.0.0.1:6379"
    password: ""
    db_index: 0
    database: false
api_cfg: # API configurations
  api_cfg_jsonRPC: # API configurations with JSON-RPC
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13001
    encryption_enabled: false
  api_cfg_mcp: # API configurations with MCP
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13002
    mcp_transport_type: "streamable-http"
  api_cfg_websocket: # API configurations with WebSocket
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13004
    allowed_origins:
    - "127.0.0.1:*"
    - "localhost:*"
  api_cfg_grpc: # API configurations with gRPC
    enabled: true
    bind_address: "0.0.0.0" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
    port: 13005
test_ui_cfg: # 开发测试台
  enabled: true # 是否提供调试台；缺省非 release 开、release 关；显式 true/false 覆盖缺省
  bind_address: "127.0.0.1" # 监听地址（必填）：127.0.0.1 仅本机；0.0.0.0 对外
  port: 13003
frontend_cfg: # 前端页面服务配置
  enabled: true # 是否提供前端静态页；缺省开；显式 true/false 覆盖缺省
  bind_address: "127.0.0.1"
  port: 13006
policy_cfg: # Policy scheduling configurations
  max_workers: 1 # 单 GPU 的绝对并发上限；正数生效
  policy_duration: "10s" # 定期轮询事项执行完一次到下一次的间隔，Go duration 字符串
  workers_scaller: 5 # 最大异步并发 = CPU 数量 × 倍率
  task_lifecycle_timeout_enabled: false # 是否启用任务整体生命周期超时；必须是 true/false。false 时忽略下面的 seconds，不设默认三天
  task_lifecycle_timeout_seconds: 3600 # 整体超时（秒），从 Accept/created_at 起算；仅在上一开关为 true 时生效，且必须为正整数（0 或负数会被配置校验拒绝）。此处只是示例值，不是默认期限
  task_execute_retry_limit_enabled: false # 是否启用执行重试次数限制；必须是 true/false，不用 0/1 代替
  task_execute_retry_limit_count: 0 # 首次执行之外允许的重试次数；0 表示不重试，不是无限。仅在上一开关为 true 时生效
auth_cfg: # Auth configurations
  enabled: true # 统一准入门禁开关；缺省 true；false=门禁放行不提供身份，依赖身份的方法不可用
  auth_type: "jwt" # 鉴权类型；缺省与当前唯一支持值均为 jwt
  email:
    enabled: false # 仅控制邮件；真实验证码始终写服务 INFO 日志
    provider: "resend" # 供应商值，不是能力配置键
    api_key: ""
    from: ""
    reply_to: ""
    product_name: "bioBox"
    verification_subject: "bioBox verification code"
  verification: # Verification code policy
    code_ttl_seconds: 600
    max_attempts: 5
    send_interval_seconds: 60
    hourly_send_limit: 5
    code_hash_secret: "dev_local_code_hash_secret_0123456789"
  session: # JWT and refresh session policy
    jwt_signing_secret: "dev_local_jwt_signing_secret_0123456789"
    issuer: "protenix_service"
    audience: "protenix_service"
    access_token_ttl_seconds: 900
    refresh_token_ttl_seconds: 2592000

cli_cfg: # protenix 与 pxdesign 各写各的命令。下面是同机：两条 host 都空，binary 在本机 /bioBox/runtime，前缀可以改成不同的本机目录。分机时给要搬走的那条填 host（本机 ssh 的目标），binary 改成那台机器上的路径；可以只填一条，或填两台不同机器。binary 为空时只拒绝该套件，不猜路径。
  work_root: "./data/cli_jobs" # 每任务作业目录根路径；输入会拷贝到子目录，不改原文件
  cancel_grace_seconds: 10 # 向进程组发 SIGTERM 后、再发 SIGKILL 的等待秒数
  execute_timeout_enabled: false # 是否启用单次 Execute 超时；必须是 true/false。false 时忽略下面的 seconds，不限制单次 Execute 时长
  execute_timeout_seconds: 3600 # 单次 Execute 最长秒数（从本次开始执行起算）；仅在上一开关为 true 时生效且必须为正整数（0 或负数会被配置校验拒绝）。到期后取消进程组，任务记 system_error。此处只是示例值
  protenix:
    # 已授权既有资源的离线内容基准：USER_EXISTING_LOCAL_SNAPSHOT_ONLY (2026-11-23)。
    # SHA256来自本机既有文件校验，不是ByteDance官方发布摘要/签名，不证明科学质量。
    # 来源与角色映射见 docs/bb_upstream/resource_final_review.md / docs/bb_build/release_delivery.md。
    # 默认下载关闭；所列HTTPS为上游公开地址，pin仍是本地内容基准，不是官方摘要。
    # 显式开启下载并确认后仅Go下载；AF2两项仍须既有文件（缺可信整tar pin），不回退Python。
    resources:
      enabled: true
      download: {download_enabled: false, retry_enabled: false, retry_count: 0}
      files:
        - {id: "ccd_components_file", size: 490777362, sha256: "bb31ae5cf6c8bc669924313077cb4231ee5ffefd3a20118cd14f3ec89f8bb6a5", url: "https://protenix.tos-cn-beijing.volces.com/common/components.cif"}
        - {id: "ccd_components_rdkit_mol_file", size: 142498117, sha256: "d1cfb71f5993a3ebea7c47877022d7f597bbfbaf86e28a4770e957da6c50cd35", url: "https://protenix.tos-cn-beijing.volces.com/common/components.cif.rdkit_mol.pkl"}
        - {id: "pdb_cluster_file", size: 21699572, sha256: "1ab4af905e75b382eda8dec59917dc3608bee0729e36b9e71baf860bbe86850c", url: "https://protenix.tos-cn-beijing.volces.com/common/clusters-by-entity-40.txt"}
        - {id: "obsolete_release_data_csv", size: 134716, sha256: "a4f3f63ac5d7eebd78b07995cc669b9eccd6f5d8813c9492c9df02868893cf33", url: "https://protenix.tos-cn-beijing.volces.com/common/obsolete_release_date.csv"}
        - {id: "model", size: 1475950125, sha256: "2b7d5a8b30494514fc47fd2271a16260528cdba170ba09cc112fdecd8f85ec04", url: "https://protenix.tos-cn-beijing.volces.com/checkpoint/protenix_base_default_v1.0.0.pt"}
    binary: "/bioBox/runtime/protenix/bin/protenix-run" # 同机示例，与 pxdesign.binary 无关。host 为空时本机 exec；host 非空时这是那台机器上的路径。权重与运行环境由服务按 v1/v2 阈值先检查，通过后才 exec 或 ssh。为空且未在 version_runtimes.v1 给出非空路径时，version=v1（或缺省）拒绝启动
    host: "" # 同机留空。分机示例写成 user@gpu-a，只影响这一套；端口和密钥用本机 ssh 配置。可以和 pxdesign.host 不同
    extra_env: {}
    version_runtimes: # 按 arguments.version 选择独立 runtime；version 不进 CLI 参数或 URL
      v2:
        binary: "" # v2 必须单独配置的已安装路径。空字符串表示未配置；version=v2 不会回退到上级 binary。跑通 v2 还需要授权权重
        extra_env: {} # 显式空映射表示不附加额外变量；若省略该键则沿用上级 extra_env
  pxdesign:
    # 已授权既有资源的离线内容基准：USER_EXISTING_LOCAL_SNAPSHOT_ONLY (2026-11-23)。
    # SHA256来自本机既有文件校验，不是ByteDance官方发布摘要/签名，不证明科学质量。
    # 来源与角色映射见 docs/bb_upstream/resource_final_review.md / docs/bb_build/release_delivery.md。
    # 默认下载关闭；所列HTTPS为上游公开地址，pin仍是本地内容基准，不是官方摘要。
    # 显式开启下载并确认后仅Go下载；AF2两项仍须既有文件（缺可信整tar pin），不回退Python。
    resources:
      enabled: true
      download: {download_enabled: false, retry_enabled: false, retry_count: 0}
      files:
        - {id: "ccd_components_file", size: 427767290, sha256: "7240b17369ccfbbcc86e2d02dc8c9db59f46c32e0420f58889c6c121c60bfef0", url: "https://pxdesign.tos-cn-beijing.volces.com/release_data/components.v20240608.cif"}
        - {id: "ccd_components_rdkit_mol_file", size: 125903802, sha256: "2d6caced2d26c62015115a1d0a50f4106755a300e0c2a2d2b5c101c9038dcbcd", url: "https://pxdesign.tos-cn-beijing.volces.com/release_data/components.v20240608.cif.rdkit_mol.pkl"}
        - {id: "pdb_cluster_file", size: 21699572, sha256: "1ab4af905e75b382eda8dec59917dc3608bee0729e36b9e71baf860bbe86850c", url: "https://pxdesign.tos-cn-beijing.volces.com/release_data/clusters-by-entity-40.txt"}
        - {id: "model", size: 556554618, sha256: "b075867bae942dc0c6487173736922b0e2913308c1ba542d227418b6e176478d", url: "https://pxdesign.tos-cn-beijing.volces.com/release_model/pxdesign_v0.1.0.pt"}
        - {id: "protenix_base_default_v0.5.0.pt", size: 1474265486, sha256: "9ea20b0aba42f2256711da1d0cd081510a4b291e64375bff6b70ced70b87a5f1", url: "https://pxdesign.tos-cn-beijing.volces.com/release_model/protenix_base_default_v0.5.0.pt"}
        - {id: "protenix_mini_default_v0.5.0.pt", size: 537049294, sha256: "3803340c5d9958c038e799ddd2b53b532db21855f261592ad455a5f003791f81", url: "https://pxdesign.tos-cn-beijing.volces.com/release_model/protenix_mini_default_v0.5.0.pt"}
        - {id: "protenix_mini_tmpl_v0.5.0.pt", size: 537487513, sha256: "221ca4da769e36ea0e2fa1fa82c46f6ca3a00bc7a1eff8ec0e3ddc02ed830474", url: "https://pxdesign.tos-cn-beijing.volces.com/release_model/protenix_mini_tmpl_v0.5.0.pt"}
        - {id: "af2_model_1", size: 373069562, sha256: "f95e453e6a290ddf317ba1c9698d53fa110cf007ea979b0eae43e6ad38b4e364"}
        - {id: "af2_model_1_ptm", size: 373103340, sha256: "5e564f79af5bcd54ccef6e2a6bb0ff01015d01650ebc41d4575e35f0de9ecc84"}
        - {id: "mpnn_ca", size: 6624011, sha256: "f28f40170e21858c5ff31ef50b6e63414ff76dc331b19f85aa8586a12031744a", url: "https://raw.githubusercontent.com/dauparas/ProteinMPNN/8907e6671bfbfc92303b5f79c4b5e6ce47cdef57/ca_model_weights/v_48_020.pt"}
        - {id: "mpnn_bb", size: 6681301, sha256: "c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd", url: "https://raw.githubusercontent.com/dauparas/ProteinMPNN/8907e6671bfbfc92303b5f79c4b5e6ce47cdef57/vanilla_model_weights/v_48_020.pt"}
    binary: "/bioBox/runtime/pxdesign/bin/pxdesign-run" # 同机示例，与 protenix.binary 无关。host 为空时本机 exec；host 非空时这是那台机器上的路径。现阶段这一套阈值由服务先检查，通过后才 exec 或 ssh
    host: "" # 同机留空。分机示例写成 user@gpu-b，可以和 protenix.host 不同。ssh 不存在、连不上或远端命令失败，只让这一条失败
    extra_env: {}

