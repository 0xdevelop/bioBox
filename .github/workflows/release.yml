# git_tag.sh -> tag push -> native matrix -> complete asset gate -> draft -> publish.
# workflow_dispatch is deliberately build-only; it cannot create a release or tag.
name: Release_Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Build:
    name: Native linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: protenix_service/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zip unzip
      - name: Validate native host and release inputs
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/check_native_build.sh "$TARGET_ARCH"
          if [[ "$REF_TYPE" == tag ]]; then
            go run gen_release_assets.go version --tag="$REF_NAME"
          else
            go run gen_release_assets.go version
          fi
          go run gen_release_assets.go self-test
      - name: Build three native packages (no prefix installation)
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FORCE_PACK: '1'
        run: |
          bash ./gen_pre_build_config.sh all
          bash ./build.sh pack release "linux_$TARGET_ARCH"
          go run gen_release_assets.go arch --arch="$TARGET_ARCH" \
            --commit="$GITHUB_SHA" --dir=build/upload_tmp_dir --out=tmp/arch-assets
      - name: Upload this architecture only
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-linux-${{ matrix.arch }}
          path: tmp/arch-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  Aggregate:
    runs-on: ubuntu-24.04
    needs: Build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: protenix_service/go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: release-packages-linux-*
          path: tmp/collected
          merge-multiple: true
      - name: Require both architectures and all six current packages
        run: |
          go run gen_release_assets.go aggregate --commit="$GITHUB_SHA" \
            --dir=tmp/collected --out=tmp/release-assets
          go run gen_release_assets.go verify --commit="$GITHUB_SHA" --dir=tmp/release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages-complete
          path: tmp/release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    # Manual dispatch NEVER publishes, even when a tag ref was selected.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: Aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: protenix_service/go.mod
      - uses: actions/download-artifact@v8
        with:
          name: release-packages-complete
          path: tmp/release-assets
      - name: Recheck complete assets before any release write
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go run gen_release_assets.go version --tag="$RELEASE_TAG"
          go run gen_release_assets.go verify --commit="$GITHUB_SHA" --dir=tmp/release-assets
      - name: Upload to a new draft, verify inventory, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Existing releases are not overwritten. A failed upload leaves only a draft.
          gh release create "$RELEASE_TAG" tmp/release-assets/* --verify-tag --draft \
            --title "$RELEASE_TAG" --notes "Native linux amd64 + arm64; three packages per architecture. See release-manifest.json and SHA256SUMS. Runtime dependencies and GPU weights are prepared by the package installers."
          gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[] | {name: .name, size: .size}]' > tmp/uploaded-assets.json
          go run gen_release_assets.go uploaded --dir=tmp/release-assets --remote=tmp/uploaded-assets.json
          gh release edit "$RELEASE_TAG" --draft=false
