# Copied from project_template_go Release_Build (release → Build → RemoveOldRelease)
# and incrementally adapted for this repository's three native linux packages.
# This change is not published in this session; the workflow is not triggered here.
name: Release_Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      UPLOAD_URL: ${{ steps.stepCreateRelease.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest tag
        run: |
          echo "LATEST_TAG=$(git tag | grep -v '^latest$' | sort -V | tail -n1)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: tag-version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          tag_prefix: ""
          custom_tag: ${{ env.LATEST_TAG }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Step GitHub release
        id: stepCreateRelease
        uses: ncipollo/release-action@v1
        with:
          skipIfReleaseExists: 'true'
          tag: ${{ env.LATEST_TAG }}
          name: ${{ env.LATEST_TAG }}
          bodyFile: changelog/${{ env.LATEST_TAG }}.md

  # Necessary split of the template Build stage: this product ships three packages
  # for linux/amd64 and linux/arm64, and the service binary requires CGo (SQLite).
  # GOARCH-only cross compilation is not treated as a native runtime build.
  build_native:
    name: Native linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: release
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: CheckOut
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protenix_service/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zip unzip

      - name: Validate native host and release inputs
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/check_native_build.sh "$TARGET_ARCH"
          if [[ "$REF_TYPE" == tag ]]; then
            go run gen_release_assets.go version --tag="$REF_NAME"
          else
            go run gen_release_assets.go version
          fi
          go run gen_release_assets.go self-test

      - name: Build three native packages (no prefix installation)
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FORCE_PACK: '1'
        run: |
          bash ./gen_pre_build_config.sh all
          bash ./build.sh pack release "linux_$TARGET_ARCH"
          go run gen_release_assets.go arch --arch="$TARGET_ARCH" \
            --commit="$GITHUB_SHA" --dir=build/upload_tmp_dir --out=tmp/arch-assets

      - name: Upload this architecture only
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-linux-${{ matrix.arch }}
          path: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'tmp/arch-assets/*' || 'tmp/arch-assets/protenix_service_*.zip' }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  Build:
    if: always() && !cancelled() && needs.build_native.result == 'success'
    runs-on: ubuntu-latest
    needs: build_native
    steps:
      - name: CheckOut
        uses: actions/checkout@v6

      - name: Set APP_VERSION env
        run: echo APP_VERSION=$(echo ${GITHUB_REF} | rev | cut -d'/' -f 1 | rev ) >> ${GITHUB_ENV}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: protenix_service/go.mod

      - name: Collect internal six-package inventory
        uses: actions/download-artifact@v8
        with:
          pattern: release-packages-linux-*
          path: tmp/collected
          merge-multiple: true

      - name: Verify six internal packages and stage three public files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          go run gen_release_assets.go aggregate --commit="$GITHUB_SHA" \
            --dir=tmp/collected --out=tmp/release-assets
          go run gen_release_assets.go verify --commit="$GITHUB_SHA" --dir=tmp/release-assets

      - name: Stage candidate bundles using the same package verifier
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: bash scripts/stage_candidate_assets.sh "$GITHUB_SHA"

      - name: Upload candidate packages (not a Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ github.sha }}
          path: tmp/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload binaries
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: upload_file_to_release
        uses: george012/upload_github_release_assets_action@latest
        with:
          path: ./tmp/release-assets/*

  RemoveOldRelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Template cleanup with proven-absence no-op; v0.0.2 is explicitly preserved.
    # Candidate builds never enter this stage.
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: install github-cli
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: CheckOut
        uses: actions/checkout@v4

      - name: Set APP_VERSION env
        run: |
          APP_VERSION=$(echo ${GITHUB_REF} | rev | cut -d'/' -f 1 | rev ) \

          function get_pre_del_tag {
              local v_str=$1
              baseStr=$(echo $v_str | cut -d'.' -f1)
              base=${baseStr//v/}
              major=$(echo $v_str | cut -d'.' -f2)
              minor=$(echo $v_str | cut -d'.' -f3)

              if ((minor>0)); then
                  minor=$((minor-1))
              else
                  minor=999
                  if ((major>0)); then
                      major=$((major-1))
                  else
                      major=999
                      if ((base>0)); then
                          base=$((base-1))
                      else
                          echo "Error: Version cannot be decremented."
                          exit 1
                      fi
                  fi
              fi

              pre_v_no="v${base}.${major}.${minor}"
              echo $pre_v_no
          }

          APP_OLD_VERSION=$(get_pre_del_tag $(get_pre_del_tag $APP_VERSION))

          echo "Old version to remove: ${APP_OLD_VERSION}"
          echo APP_OLD_VERSION=${APP_OLD_VERSION} >> ${GITHUB_ENV}

      - name: Remove Old Release
        run: |
          if [[ "$APP_OLD_VERSION" == v0.0.2 ]]; then
            echo "[release-cleanup] v0.0.2 is preserved; no-op"
          else
            source ./scripts/release_cleanup.sh
            release_remove_old_if_present "$APP_OLD_VERSION" "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
